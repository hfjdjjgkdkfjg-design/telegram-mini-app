<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Tads Ads SDK -->
    <script src="https://w.tads.me/widget.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 380px;
            text-align: center;
            padding: 35px 25px;
            background: #1f2937;
            border-radius: 20px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        p {
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: #3390ec;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        #status {
            margin-top: 15px;
            font-size: 13px;
            color: #9ca3af;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Welcome</h1>
    <p>Press the button below to continue.</p>

    <button id="continueBtn">Continue</button>

    <div id="status"></div>
</div>

<script>
    // Initialize Telegram Mini App
    if (window.Telegram && window.Telegram.WebApp) {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
    }

    // Destination link
    const destination = "https://example.com";

    const button = document.getElementById("continueBtn");
    const status = document.getElementById("status");

    let processing = false;

    // Tads configuration
    const WIDGET_ID = 13545; // REPLACE with your actual Widget ID
    const IS_DEBUG = false;
    const BUTTON_ID = "continueBtn";

    // Reward callback
    const onShowRewardCallback = (adId) => {
        console.log("Ad watched, reward the user:", adId);
    };

    // No ads available callback
    const onAdsNotFound = () => {
        console.log("No ads available right now.");
    };

    document.addEventListener("DOMContentLoaded", function () {

        // Initialize Tads
        const adController = window.tads.init({
            widgetId: WIDGET_ID,
            type: "fullscreen",
            debug: IS_DEBUG,
            onShowReward: onShowRewardCallback,
            onAdsNotFound: onAdsNotFound
        });

        // Continue button
        document.getElementById(BUTTON_ID).addEventListener("click", async () => {

            if (processing) return;

            processing = true;
            button.disabled = true;
            status.textContent = "Loading...";

            try {
                // Show Tads fullscreen ad
                await adController.showAd();

                status.textContent = "Continuing...";

            } catch (error) {
                console.log("Tads ad error:", error);
            }

            // Continue even if the ad fails or is unavailable
            window.location.href = destination;
        });
    });
</script>

</body>
</html>
