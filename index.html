<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Tads Ad SDK -->
    <script src="https://w.tads.me/widget.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #121212;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            padding: 30px 22px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
        }

        p {
            color: #bdbdbd;
            font-size: 15px;
            line-height: 1.6;
        }

        /* Banner ad container */
        #tads-container-13545 {
            width: 100%;
            margin: 20px auto;
        }

        /* Continue button */
        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 12px;
            background: #2ea6ff;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.85;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #status {
            margin-top: 15px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Welcome</h1>

        <p>
            Welcome! Press Continue below to proceed.
        </p>

        <!-- TADS BANNER AD -->
        <div id="tads-container-13545"></div>

        <!-- CONTINUE BUTTON -->
        <button id="continueBtn">Continue</button>

        <div id="status"></div>

    </div>

    <script>
        // Initialize Telegram Mini App
        if (window.Telegram && window.Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
        }

        // TADS CONFIGURATION
        const WIDGET_ID = "13545";

        // Destination after the ad
        const destination = "https://example.com";

        let adController = null;

        // Initialize TADS fullscreen ad
        document.addEventListener("DOMContentLoaded", function () {

            const status = document.getElementById("status");
            const button = document.getElementById("continueBtn");

            try {
                if (window.tads) {
                    adController = window.tads.init({
                        id: WIDGET_ID,
                        type: "fullscreen",
                        debug: false,

                        onAdsNotFound: function () {
                            console.log("No fullscreen ads available.");
                        }
                    });

                    console.log("Tads initialized.");
                } else {
                    console.error("Tads SDK failed to load.");
                }
            } catch (error) {
                console.error("Tads initialization error:", error);
            }

            // Continue button triggers fullscreen ad
            button.addEventListener("click", async function () {

                button.disabled = true;
                status.textContent = "Loading...";

                try {
                    if (adController) {
                        await adController.showAd();
                    }
                } catch (error) {
                    console.log("Ad unavailable:", error);
                }

                // Continue to destination even if ad fails
                window.location.href = destination;
            });

        });
    </script>

</body>
</html>
